[project]
name = "dual-mode-coherence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Julius Steuer", email = "juliussteuer87@gmail.com" },
    { name = "Souvik Banerjee", email = "souvik.banerjee@h-its.org"}
    
]
requires-python = ">=3.12"
dependencies = [
    "maverick-coref>=1.0.7",
    "minicons>=0.3.39",
    "spacy>=3.8.16",
    "transformers==5.2.0",
    # scripts/entity_iv: Stanza parses the alternatives, torch backs both the
    # coreference model and the sentence embeddings used for the semantic
    # distances.
    "stanza>=1.10",
    "torch>=2.4",
    # spaCy ships its models as separate wheels rather than on PyPI; the POS
    # n-gram distances and the sentence splitter both load en_core_web_sm.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
# Only the alternative-generation step needs vLLM, and it is a large install,
# so it is kept out of the default set: uv sync --extra generation
generation = [
    "vllm>=0.6",
]

[project.scripts]
dual-mode-coherence = "dual_mode_coherence:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
